---
name: Set up Elixir and restore dependencies
description: >-
  Install Erlang/OTP and Elixir, then restore the Elixir dependency cache.
  With build-deps, also build the dependencies on a cache miss. The jobs that
  build the dependencies and the jobs that use them share this cache key
  format. MIX_ENV must be set in the job environment.

inputs:
  otp-version:
    description: Erlang/OTP version. It is also part of the cache key.
    required: true
  elixir-version:
    description: Elixir version. It is also part of the cache key.
    required: true
  cache-key-suffix:
    description: Extra cache key segment, added after the Elixir version. Empty adds nothing.
    required: false
    default: ""
  setup-beam:
    description: Set to "false" to restore the cache without installing Erlang/OTP and Elixir.
    required: false
    default: "true"
  build-deps:
    description: >-
      Set to "true" to fetch and compile the dependencies, and to build the
      Dialyzer PLT when MIX_ENV is not prod, on a cache miss. The cache saves
      the result at the end of the job.
    required: false
    default: "false"

outputs:
  cache-hit:
    description: '"true" when the cache key matched exactly.'
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Check MIX_ENV
      shell: bash
      run: '"${{ github.action_path }}/check-mix-env.sh"'
    - name: Set up Erlang/OTP and Elixir
      if: inputs.setup-beam == 'true'
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
      with:
        otp-version: ${{ inputs.otp-version }}
        elixir-version: ${{ inputs.elixir-version }}
    - name: Restore Elixir dependencies
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          deps
          _build/${{ env.MIX_ENV }}
          priv/plts
        key: erlang-${{ inputs.otp-version }}-elixir-${{ inputs.elixir-version }}${{ inputs.cache-key-suffix != '' && format('-{0}', inputs.cache-key-suffix) || '' }}-${{ hashFiles('mix.lock') }}-${{ env.MIX_ENV }}
    - name: Install dependencies
      if: inputs.build-deps == 'true' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p priv/plts
        mix local.rebar --force
        mix local.hex --force
        mix deps.get
        mix deps.compile --warnings-as-errors
    - name: Build Dialyzer PLT
      if: inputs.build-deps == 'true' && steps.cache.outputs.cache-hit != 'true' && env.MIX_ENV != 'prod'
      shell: bash
      run: mix dialyzer --plt
