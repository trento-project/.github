        mix local.rebar --force
        mix local.hex --force
        mix deps.get
        mix deps.compile --warnings-as-errors
        if [[ "$MIX_ENV" != "prod" ]]; then mix dialyzer --plt; fi
    - name: "Toolchain 1, env 3: save dependencies"
      if: steps.matrix.outputs.T0_ELIXIR != '' && steps.matrix.outputs.ENV2 != '' && steps.deps-0-2.outputs.cache-hit != 'true'
