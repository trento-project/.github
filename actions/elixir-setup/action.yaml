          priv/plts
        key: erlang-${{ steps.matrix.outputs.T1_OTP }}-elixir-${{ steps.matrix.outputs.T1_ELIXIR }}${{ steps.matrix.outputs.SUFFIX }}-${{ hashFiles('mix.lock') }}-${{ steps.matrix.outputs.ENV1 }}
    - name: "Toolchain 2, env 3: clean the workspace"
