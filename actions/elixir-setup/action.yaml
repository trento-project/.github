    - name: "Toolchain 2, env 2: save dependencies"
      if: steps.matrix.outputs.T1_ELIXIR != '' && steps.matrix.outputs.ENV1 != '' && steps.deps-1-1.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          deps
