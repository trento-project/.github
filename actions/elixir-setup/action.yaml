    - name: "Toolchain 2: set up Erlang/OTP and Elixir"
      if: steps.matrix.outputs.T1_ELIXIR != ''
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
