        key: erlang-${{ steps.matrix.outputs.T0_OTP }}-elixir-${{ steps.matrix.outputs.T0_ELIXIR }}${{ steps.matrix.outputs.SUFFIX }}-${{ hashFiles('mix.lock') }}-${{ steps.matrix.outputs.ENV1 }}
    - name: "Toolchain 1, env 3: clean the workspace"
      if: steps.matrix.outputs.T0_ELIXIR != '' && steps.matrix.outputs.ENV2 != ''
      shell: bash
      run: rm -rf deps _build priv/plts
    - name: "Toolchain 1, env 3: restore dependencies"
      id: deps-0-2
      if: steps.matrix.outputs.T0_ELIXIR != '' && steps.matrix.outputs.ENV2 != ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          deps
          _build/${{ steps.matrix.outputs.ENV2 }}
          priv/plts
        key: erlang-${{ steps.matrix.outputs.T0_OTP }}-elixir-${{ steps.matrix.outputs.T0_ELIXIR }}${{ steps.matrix.outputs.SUFFIX }}-${{ hashFiles('mix.lock') }}-${{ steps.matrix.outputs.ENV2 }}
    - name: "Toolchain 1, env 3: build dependencies"
      if: steps.matrix.outputs.T0_ELIXIR != '' && steps.matrix.outputs.ENV2 != '' && steps.deps-0-2.outputs.cache-hit != 'true'
      shell: bash
      env:
        MIX_ENV: ${{ steps.matrix.outputs.ENV2 }}
      run: |
