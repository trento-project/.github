---
name: Export environment variables
description: >-
  Write the keys of a JSON object to the job environment. Keys must be valid
  environment variable names, values must be single-line. `MIX_ENV` is not
  allowed.

inputs:
  env:
    description: JSON object of environment variables.
    required: true

runs:
  using: composite
  steps:
    - name: Export environment variables
      shell: bash
      env:
        EXTRA_ENV: ${{ inputs.env }}
      run: '"${{ github.action_path }}/export-env.sh"'
