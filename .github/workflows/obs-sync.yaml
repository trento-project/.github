---
name: OBS sync

on:
  workflow_call:
    inputs:
      update_changelog:
        type: boolean
        default: false
        description: Whether or not to update the OBS package changelog. Should only be used contextually to a release.
      obs_project:
        type: string
        required: true
        description: The OBS project to commit changes to.
      obs_package:
        type: string
        required: true
        description: The OBS package to commit change to.
      obs_image_package:
        type: string
        default: ""
        description: >-
          The OBS image package that receives the `packaging/suse/container/`
          folder, when the repository has one. Defaults to `<obs_package>-image`.
      source_ref:
        type: string
        default: ""
        description: >-
          The commit, branch or tag whose `packaging/suse/container/` folder
          is synced to the image package. Defaults to the commit that
          triggered the workflow.
    secrets:
      gh_token:
        required: true
        description: GitHub Personal Access Token to interact with GH API.
      obs_user:
        required: true
        description: OBS username for API (OBS and git) and repository access.
      obs_pass:
        required: true
        description: OBS password for API (OBS-only) access.
      obs_ssh_key:
        required: true
        description: >-
          SSH Key for the `obs_user` that would allow repository
          access when OBS sources are kept in git.

concurrency: ${{ github.workflow }}-${{ inputs.obs_project }}

env:
  AUTHOR_EMAIL: trento-developers@suse.com

jobs:
  sync-rpm:
    name: Update RPM package definitions
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/trento-project/continuous-delivery@sha256:27b18643b1d39af6551cc165e79fc147835cbb7a5dcef37e6a889f94cea1fef5 # v1.4.0
      options: -u 0:0

    steps:
      - name: Check out the shared workflows repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-workflows
          persist-credentials: false

      - name: Set up OBS access
        uses: ./.shared-workflows/actions/setup-obs
        with:
          obs-user: ${{ secrets.obs_user }}
          obs-pass: ${{ secrets.obs_pass }}
          obs-ssh-key: ${{ secrets.obs_ssh_key }}
          author-email: ${{ env.AUTHOR_EMAIL }}

      - name: Checkout OBS package
        id: checkout
        run: |
          osc checkout ${{ inputs.obs_project }} ${{ inputs.obs_package }}
          cd ${{ inputs.obs_project }}/${{ inputs.obs_package }}

          echo "checkout_dir=$(pwd)" >> $GITHUB_OUTPUT
          echo "On branch: $(git branch -v)"
          echo -e "Remote:\n$(git remote -v)"

      - name: Remove old upstream tarballs
        run: |
          cd ${{ steps.checkout.outputs.checkout_dir }}
          rm -vf *.tar.gz

      - name: Run services
        id: services
        run: |
          cd ${{ steps.checkout.outputs.checkout_dir }}
          osc service manualrun

          # Extract version
          echo "Extracting version..."
          vfile="$(ls *.spec Chart.yaml 2>/dev/null | head -n 1)"
          version="$(sed -n 's/^version:\s*\(.*\)/\1/Ip' "$vfile")"
          echo "version=${version}" >> $GITHUB_OUTPUT
          echo New version is $version

      - name: Handle .changes file
        if: inputs.update_changelog
        env:
          GITHUB_OAUTH_TOKEN: ${{ secrets.gh_token }}
        run: |
          release_version="$(echo '${{ steps.services.outputs.version }}' | cut -d'+' -f 1)"
          /scripts/gh_release_to_obs_changeset.py \
              ${{ github.repository }} \
              -a "$AUTHOR_EMAIL" \
              -t "${release_version}" \
              -f ${{ steps.checkout.outputs.checkout_dir }}/${{ inputs.obs_package }}.changes

      - name: Commit and push
        run: |
          cd ${{ steps.checkout.outputs.checkout_dir }}

          echo Git changes:
          git add -A
          git status

          if git diff-index --quiet HEAD; then
            echo Skipping commit and push since there are no changes.

          else
            echo Commit changes and push...
            git commit -m "GitHub Actions automated update to version ${{ steps.services.outputs.version }}"

            # XXX: If stuck indefinitely here, then check if
            # permissions to push into repo are allowed. Suspected Git
            # LFS bug.
            git push origin
          fi

  sync-image:
    name: Update container image definitions
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/trento-project/continuous-delivery@sha256:27b18643b1d39af6551cc165e79fc147835cbb7a5dcef37e6a889f94cea1fef5 # v1.4.0
      options: -u 0:0
    env:
      OBS_PROJECT: ${{ inputs.obs_project }}
      OBS_IMAGE_PACKAGE: ${{ inputs.obs_image_package || format('{0}-image', inputs.obs_package) }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          path: source
          persist-credentials: false

      - name: Detect container files
        id: detect
        run: |
          if [ -d source/packaging/suse/container ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "The repository has no packaging/suse/container folder. Nothing to sync."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the shared workflows repository
        if: steps.detect.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-workflows
          persist-credentials: false

      - name: Set up OBS access
        if: steps.detect.outputs.enabled == 'true'
        uses: ./.shared-workflows/actions/setup-obs
        with:
          obs-user: ${{ secrets.obs_user }}
          obs-pass: ${{ secrets.obs_pass }}
          obs-ssh-key: ${{ secrets.obs_ssh_key }}
          author-email: ${{ env.AUTHOR_EMAIL }}

      - name: Trust the repository checkout
        if: steps.detect.outputs.enabled == 'true'
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}/source"

      - name: Check out the OBS image package
        id: checkout
        if: steps.detect.outputs.enabled == 'true'
        run: |
          osc checkout "${OBS_PROJECT}" "${OBS_IMAGE_PACKAGE}"
          cd "${OBS_PROJECT}/${OBS_IMAGE_PACKAGE}"

          # osc checks out the commit that OBS imported last, which can be
          # behind the branch. Start from the branch tip instead.
          git fetch origin
          git reset --hard '@{upstream}'

          echo "checkout_dir=$(pwd)" >> "$GITHUB_OUTPUT"
          echo "On branch: $(git branch -v)"

      - name: Sync container files
        id: sync
        if: steps.detect.outputs.enabled == 'true'
        uses: ./.shared-workflows/actions/sync-container-files
        with:
          source-dir: source
          target-dir: ${{ steps.checkout.outputs.checkout_dir }}
          repository: ${{ github.repository }}
          changes-file: ${{ env.OBS_IMAGE_PACKAGE }}.changes
          author-email: ${{ env.AUTHOR_EMAIL }}
          github-token: ${{ secrets.gh_token }}

      - name: Push
        if: steps.sync.outputs.changed == 'true'
        env:
          CHECKOUT_DIR: ${{ steps.checkout.outputs.checkout_dir }}
        run: |
          cd "${CHECKOUT_DIR}"
          git push origin
