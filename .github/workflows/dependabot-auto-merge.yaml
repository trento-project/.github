---
name: Dependabot auto-merge

on:
  workflow_call:
    secrets:
      gh_token:
        description: >-
          Token that enables auto-merge. A merge made with GITHUB_TOKEN starts
          no workflows on the default branch, so pass a personal access token
          or a GitHub App token to get the push run. Dependabot runs read only
          Dependabot secrets, so store it there too. Falls back to GITHUB_TOKEN.
        required: false

# Dependabot runs get a read-only token unless the caller workflow asks for more.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-merge:
    name: Approve and enable auto-merge
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # update-type is the highest semver change in the pull request, so a group
      # containing one major bump is held back as a whole.
      - name: Don't approve and comment on major version update
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment "$PR_URL" --body "⚠️ **Major version update detected** - requires manual review before merging."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve and merge if minor or patch version update
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_TOKEN: ${{ secrets.gh_token || secrets.GITHUB_TOKEN }}
        run: |
          gh pr review --approve "$PR_URL"
          GH_TOKEN="$MERGE_TOKEN" gh pr merge --auto --squash "$PR_URL"
