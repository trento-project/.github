---
name: Test actions

on:
  push:
    branches: [main]
    paths:
      - actions/**
      - .github/workflows/test-actions.yaml
      # The setup-obs tests use the container image of this workflow.
      - .github/workflows/obs-sync.yaml
  pull_request:
    paths:
      - actions/**
      - .github/workflows/test-actions.yaml
      # The setup-obs tests use the container image of this workflow.
      - .github/workflows/obs-sync.yaml

permissions:
  contents: read

env:
  BATS_VERSION: "1.14.0" # https://github.com/bats-core/bats-core/releases

jobs:
  test:
    name: Lint and test action scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup BATS
        uses: bats-core/bats-action@3566550e0f594451ac0f58fcbfdeca93aa29a45e # v4.1.0
        with:
          bats-version: ${{ env.BATS_VERSION }}
      - name: Run shellcheck
        run: shellcheck actions/*/*.sh
      - name: Run bats tests
        run: bats actions/*/tests/*.bats
