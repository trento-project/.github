---
name: OTP/Elixir toolchain

on:
  workflow_call:
    inputs:
      elixir_bc:
        type: string
        default: ""
        description: Elixir version of the backward compatibility toolchain, for example `1.15.7-otp-26`. Required when `bc_enabled` is true.
      erlang_bc:
        type: string
        default: ""
        description: Erlang/OTP version of the backward compatibility toolchain, for example `26.2.1`. Required when `bc_enabled` is true.
      bc_enabled:
        type: boolean
        default: false
        description: Whether or not to also run Elixir jobs against the backward compatibility toolchain.
      checkout_ref:
        type: string
        default: ""
        description: Ref to read `.tool-versions` from. Defaults to the ref that triggered the workflow.
    outputs:
      ELIXIR_DEV:
        description: Elixir version from `.tool-versions`.
        value: ${{ jobs.toolchain.outputs.ELIXIR_DEV }}
      ERLANG_DEV:
        description: Erlang/OTP version from `.tool-versions`.
        value: ${{ jobs.toolchain.outputs.ERLANG_DEV }}
      TOOLCHAINS:
        description: >-
          JSON array of `{elixir, otp}` objects. Pass it through `fromJson` to
          use it as a matrix dimension.
          It holds the `.tool-versions` toolchain, preceded by the backward
          compatibility toolchain when `bc_enabled` is true.
        value: ${{ jobs.toolchain.outputs.TOOLCHAINS }}

jobs:
  toolchain:
    name: Compute OTP/Elixir toolchain
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      ELIXIR_DEV: ${{ steps.compute.outputs.ELIXIR_DEV }}
      ERLANG_DEV: ${{ steps.compute.outputs.ERLANG_DEV }}
      TOOLCHAINS: ${{ steps.compute.outputs.TOOLCHAINS }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false
      - name: Compute toolchain
        id: compute
        uses: trento-project/.github/actions/elixir-toolchain@shared-elixir-otp-toolchain-matrix
        with:
          elixir-bc: ${{ inputs.elixir_bc }}
          erlang-bc: ${{ inputs.erlang_bc }}
          bc-enabled: ${{ inputs.bc_enabled }}
