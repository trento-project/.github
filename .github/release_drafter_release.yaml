name-template: $RESOLVED_VERSION
tag-template: $RESOLVED_VERSION
categories:
  - title: Features
    labels:
      - feature
      - enhancement
  - title: Bug Fixes
    labels:
      - fix
      - bugfix
      - bug
  - title: Maintenance
    labels:
      - chore
      - ci
      - tech-debt
  - title: Dependencies
    label: dependencies
    collapse-after: 3
category-template: |
  ### $TITLE
version-resolver:
  major:
    labels:
      - major
      - breaking
  minor:
    labels:
      - feature
      - enhancement
      - minor
  patch:
    labels:
      - patch
      - bug
  default: patch
# `backport-as-hotfix` is deliberately not excluded here, unlike on main:
# on the release branch those pull requests are the release.
exclude-labels:
  - skip-release-notes
template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...$RESOLVED_VERSION
